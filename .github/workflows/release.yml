name: 📦 Build release ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Test, package and publish
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 🧪 Run tests
        run: python -m unittest discover -s tests -v

      - name: 🏷️ Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: 🗜️ Build ZIP
        id: zip
        run: |
          VERSION="${{ steps.ver.outputs.value }}"
          NAME="Realms-Trimmer-${VERSION}.zip"
          zip -q "${NAME}" realms_trimmer.py README.md CHANGELOG.md
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "### 📦 Package built" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: \`${NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(du -h "${NAME}" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: 📝 Build release notes
        run: |
          VERSION="${{ steps.ver.outputs.value }}"
          {
            echo "## ✂️ Realms Trimmer — ${VERSION}"
            echo ""
            echo "1. Install [Python 3](https://www.python.org/downloads/) if you don't have it."
            echo "2. Unzip and **double-click \`realms_trimmer.py\`**."
            echo "3. Pick your world folder and an output folder, then click **Recortar**."
            echo "4. Upload the trimmed copy from Minecraft: **Realms → Configure → Worlds → Upload world**."
            echo ""
            echo "### 📜 Changelog"
            echo ""
            awk '/^## /{n++} n==1' CHANGELOG.md 2>/dev/null || echo "_See CHANGELOG.md_"
          } > RELEASE_NOTES.md

      - name: 🚀 Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.value }}"
          gh release create "${VERSION}" "${{ steps.zip.outputs.name }}" \
            --title "✂️ ${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            || gh release upload "${VERSION}" "${{ steps.zip.outputs.name }}" --clobber
