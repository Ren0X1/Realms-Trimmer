name: 🧪 Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.8', '3.13']

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 🔎 Compile check
        run: python -m py_compile realms_trimmer.py

      - name: 🧪 Run tests
        run: python -m unittest discover -s tests -v

      - name: ⌨️ CLI smoke test
        run: python realms_trimmer.py --help
